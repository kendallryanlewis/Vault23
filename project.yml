name: Vault23

options:
  bundleIdPrefix: com.kndl
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  Vault23:
    type: application
    platform: iOS
    sources:
      - path: ClosetApp
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    info:
      path: ClosetApp/Info.plist
      properties:
        CFBundleDisplayName: Vault23
        NSCameraUsageDescription: "Vault23 uses the camera to scan sneaker barcodes."
        NSPhotoLibraryUsageDescription: "Vault23 reads photos to add to your profile background."
        NSAppTransportSecurity:
          # Allow plain-HTTP to the Angular dev server running on localhost
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kndl.Vault23
      TARGETED_DEVICE_FAMILY: "1,2"
      DEVELOPMENT_TEAM: ""
    # ── Build scripts ──────────────────────────────────────────────────────────
    preBuildScripts:
      - name: "[Angular] Build web app (Release only)"
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then exit 0; fi
          export PATH="/opt/homebrew/bin:$PATH"
          cd "${SRCROOT}/closet-web"
          npm run build -- --base-href /
        basedOnDependencyAnalysis: false

    postCompileScripts:
      - name: "[Angular] Copy dist into app bundle"
        script: |
          DIST="${SRCROOT}/closet-web/dist/closet-web/browser"
          if [ ! -d "${DIST}" ]; then exit 0; fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/www"
          mkdir -p "${DEST}"
          rsync -a --delete "${DIST}/" "${DEST}/"
        basedOnDependencyAnalysis: false

  Vault23UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Vault23UITests
    dependencies:
      - target: Vault23
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kndl.Vault23UITests
      DEVELOPMENT_TEAM: ""

schemes:
  Vault23:
    build:
      targets:
        Vault23: all
        Vault23UITests:
          - test
    test:
      config: Debug
      targets:
        - Vault23UITests
    run:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
