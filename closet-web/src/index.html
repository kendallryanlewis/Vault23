<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Vault23</title>
  <base href="/">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: url('/assets/backgrounds/Background_1.png');
      background-size: cover;
      background-position: center;
      transition: opacity 0.4s ease;
    }

    #app-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    #app-splash__brand {
      position: relative;
      z-index: 1;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
    }

    #app-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app-splash" aria-hidden="true">
    <span id="app-splash__brand">VAULT | 23</span>
  </div>
  <app-root></app-root>
  <script>
    (function () {
      var splash = document.getElementById('app-splash');
      if (!splash) return;
      var start = Date.now();
      var MIN_MS = 2500;
      var ready = false;
      function dismiss() {
        var elapsed = Date.now() - start;
        var delay = Math.max(0, MIN_MS - elapsed);
        setTimeout(function () {
          splash.classList.add('fade-out');
          setTimeout(function () { splash.remove(); }, 420);
        }, delay);
      }
      document.addEventListener('app:ready', dismiss, { once: true });
    })();
  </script>
</body>

</html>
