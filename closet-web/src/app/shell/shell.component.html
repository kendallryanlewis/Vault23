<div class="shell">
    <main class="shell__content">
        <router-outlet />
    </main>

    @if (showOnboarding()) {
    <app-onboarding (done)="showOnboarding.set(false)" />
    }

    <nav class="tab-bar"
        [class.tab-bar--hidden]="uiState.detailOpen() || uiState.navHidden() || keyboard.keyboardHeight() > 0 || showOnboarding()">
        <a class="tab-bar__item" routerLink="/app/home" routerLinkActive="tab-bar__item--active"
            [routerLinkActiveOptions]="{exact:true}" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </a>
        <a class="tab-bar__item" routerLink="/app/search" routerLinkActive="tab-bar__item--active" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
        </a>
        <a class="tab-bar__item" (click)="openPostPicker()" aria-label="Camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" />
            </svg>
        </a>
        <!-- Camera capture (device camera) -->
        <input #cameraInput type="file" accept="image/*" capture="environment" style="display:none"
            (change)="onCameraFile($event)" />
        <!-- Gallery picker (photo library, no capture constraint) -->
        <input #galleryInput type="file" accept="image/*" style="display:none" (change)="onCameraFile($event)" />

        @if (postPickerOpen()) {
        <div class="post-picker__backdrop" (click)="postPickerOpen.set(false)"></div>
        <div class="post-picker__sheet">
            <div class="post-picker__handle"></div>
            <button class="post-picker__btn" (click)="postPickerOpen.set(false); cameraInput.click()">
                <span class="material-symbols-outlined">photo_camera</span>
                Take Photo
            </button>
            <button class="post-picker__btn" (click)="postPickerOpen.set(false); galleryInput.click()">
                <span class="material-symbols-outlined">photo_library</span>
                Choose from Library
            </button>
        </div>
        }
        <a class="tab-bar__item" routerLink="/app/messages" routerLinkActive="tab-bar__item--active"
            aria-label="Messages">
            <div class="tab-bar__icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                @if (hasUnread()) {
                <span class="tab-bar__badge"></span>
                }
            </div>
        </a>
        <a class="tab-bar__item" routerLink="/app/profile" routerLinkActive="tab-bar__item--active"
            aria-label="Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </a>
    </nav>
</div>
