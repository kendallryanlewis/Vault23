<div class="auth-screen">
  <!-- Hero -->
  <div class="auth-screen__hero">
    <p class="auth-screen__brand">VAULT | 23</p>
    <h1 class="auth-screen__headline">Create<br>account.</h1>
  </div>

  <!-- Form -->
  <div class="auth-screen__content">
    <div class="auth-fields">
      <div class="auth-field">
        <label class="auth-field__label">Name</label>
        <input class="auth-field__input" type="text" placeholder="Your name" [(ngModel)]="displayName"
          autocomplete="name" />
      </div>
      <div class="auth-field">
        <label class="auth-field__label">Username</label>
        <input class="auth-field__input" type="text" placeholder="@username" [(ngModel)]="username"
          autocomplete="username" />
      </div>
      <div class="auth-field">
        <label class="auth-field__label">Email</label>
        <input class="auth-field__input" type="email" placeholder="you@example.com" [(ngModel)]="email"
          autocomplete="email" />
      </div>
      <div class="auth-field">
        <label class="auth-field__label">Password</label>
        <input class="auth-field__input" type="password" placeholder="6+ characters" [(ngModel)]="password"
          autocomplete="new-password" />
      </div>
    </div>

    @if (error()) {
    <p class="auth-screen__error">{{ error() }}</p>
    }

    <button class="btn btn--primary auth-screen__cta" (click)="onRegister()" [disabled]="loading()">
      @if (loading()) { <span class="spinner"></span> } @else { Create Account }
    </button>

    <div class="auth-screen__divider"><span>or</span></div>

    <button class="btn btn--secondary" (click)="onApple()" [disabled]="loading()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
      </svg>
      Continue with Apple
    </button>

    <p class="auth-screen__footer">
      Already have an account? <a routerLink="/auth/login">Sign In</a>
    </p>
  </div>
</div>
