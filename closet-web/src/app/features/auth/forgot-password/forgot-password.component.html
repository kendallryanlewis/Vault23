<div class="auth-screen">
    <!-- Hero -->
    <div class="auth-screen__hero">
        <h1 class="auth-screen__headline">Forgot<br>password.</h1>
    </div>

    <!-- Bottom sheet -->
    <div class="auth-screen__sheet p-4">
        <div class="auth-screen__handle"></div>

        @if (sent()) {
        <p class="auth-screen__sent">Check your inbox — a reset link is on its way.</p>
        <a class="btn btn--primary" routerLink="/auth/login">Back to Sign In</a>
        } @else {
        <div class="auth-fields">
            <div class="auth-field">
                <label class="auth-field__label">Email</label>
                <input class="auth-field__input" type="email" placeholder="you@example.com" [(ngModel)]="email"
                    autocomplete="email" />
            </div>
        </div>

        @if (error()) {
        <p class="auth-screen__error">{{ error() }}</p>
        }

        <button class="btn btn--primary auth-screen__cta" (click)="onSend()" [disabled]="loading()">
            @if (loading()) { <span class="spinner"></span> } @else { Send Reset Link }
        </button>

        <p class="auth-screen__footer">
            <a routerLink="/auth/login">← Back to Sign In</a>
        </p>
        }
    </div>
</div>
