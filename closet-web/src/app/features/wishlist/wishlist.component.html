<div class="page">
    <h2 class="page__title">Wishlist</h2>

    @if (items().length === 0) {
    <div class="empty-state">
        <p>Your wishlist is empty.</p>
    </div>
    }

    <div class="grid">
        @for (item of items(); track item.id) {
        <div class="card item-card">
            @if (item.imageUrl) {
            <img class="item-card__img" [src]="item.imageUrl" [alt]="item.name" loading="lazy" />
            } @else {
            <div class="item-card__img item-card__img--placeholder"></div>
            }
            <div class="item-card__body">
                <p class="item-card__name">{{ item.name }}</p>
                <p class="item-card__meta">{{ item.brand }} · Sz {{ item.size }}</p>
                @if (item.retailPrice) {
                <p class="item-card__price">Retail \${{ item.retailPrice }}</p>
                }
            </div>
            <button class="item-card__remove" (click)="remove(item.id)" aria-label="Remove">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14H6L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                </svg>
            </button>
        </div>
        }
    </div>
</div>
